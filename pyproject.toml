[project]
name = "jobportal-backend"
version = "0.1.0"
description = "Job Portal Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests need a real PostgreSQL: the statistics query uses window functions and
# FILTER, and the whole point is to verify behaviour against the real planner.
# TEST_DATABASE_URL selects the database; see tests/conftest.py.
addopts = "-q"
